name: Test

permissions:
  contents: read

on: [push]

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: Install github-proxy
        run: cargo install --path .

      - name: Test all proxy services
        run: |
          OUT="$RUNNER_TEMP/github-proxy-test"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          PROXIES=(github jsdelivr)
          FILE_URL="https://github.com/easy-install/easy-install/raw/main/install.sh"
          RELEASE_SPEC="easy-install/easy-install@nightly"
          RELEASE_ASSET="ei-aarch64-apple-darwin.tar.gz"

          summary() {
            echo ""
            echo "=========================================="
            echo "All tests passed"
            echo "=========================================="
            ls -lh "$OUT"
          }

          echo "=========================================="
          echo "Mirrors"
          echo "=========================================="
          github-proxy ls

          echo ""
          echo "=========================================="
          echo "Release listing"
          echo "=========================================="
          github-proxy ls "$RELEASE_SPEC" --name "$RELEASE_ASSET"
          echo "--- URL ---"
          github-proxy ls "$RELEASE_SPEC" --name "$RELEASE_ASSET" --url

          echo ""
          echo "=========================================="
          echo "File resources (raw)"
          echo "=========================================="
          for proxy in "${PROXIES[@]}"; do
            echo ""
            echo "--- $proxy ---"
            out="$OUT/raw-$proxy.sh"
            # `fetch` prints the rewritten URL and downloads it, so this covers
            # both URL generation and the actual transfer.
            github-proxy -p "$proxy" fetch "$FILE_URL" -o "$out"
            test -s "$out"
            echo "  ✓ $(wc -c < "$out" | tr -d ' ') bytes"
          done

          echo ""
          echo "=========================================="
          echo "Release resources"
          echo "=========================================="
          for proxy in "${PROXIES[@]}"; do
            echo ""
            echo "--- $proxy ---"
            out="$OUT/release-$proxy.tar.gz"
            if github-proxy -p "$proxy" fetch "$RELEASE_SPEC" "$RELEASE_ASSET" -o "$out"; then
              test -s "$out"
              echo "  ✓ $(wc -c < "$out" | tr -d ' ') bytes"
            elif [ "$proxy" = "jsdelivr" ]; then
              # jsdelivr serves raw files only and must fail loudly.
              echo "  ⊘ rejected, as expected (no release support)"
              test ! -e "$out"
            else
              echo "  ✗ download failed"
              exit 1
            fi
          done

          echo ""
          echo "=========================================="
          echo "Latest release (no tag)"
          echo "=========================================="
          github-proxy fetch easy-install/easy-install "$RELEASE_ASSET" -o "$OUT/latest-$RELEASE_ASSET"
          test -s "$OUT/latest-$RELEASE_ASSET"

          summary
